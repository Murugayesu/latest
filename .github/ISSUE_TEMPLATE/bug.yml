name: Bug
description: An error, a crash, an install problem, or the skill not loading.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the full output or error.
      render: text
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How you installed it
      description: Skills CLI, Claude Code plugin, or copied by hand
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Operating system, Python version, agent and model
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: Registry answers change daily, so the date matters.
